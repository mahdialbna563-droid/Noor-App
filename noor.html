<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3b3c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>نور - القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0b3b3c;
    --teal:#13686a;
    --glow:#f6d77a;
    --gold:#d9aa45;
    --paper:#fff8e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Cairo',Tahoma,sans-serif;
    color:var(--paper);
    background:radial-gradient(circle at 50% 38%,#1f8a88 0%,var(--teal) 35%,var(--deep) 100%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stars{position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 20% 30%,var(--glow),transparent),
      radial-gradient(2px 2px at 75% 20%,var(--glow),transparent),
      radial-gradient(1.5px 1.5px at 60% 70%,var(--glow),transparent),
      radial-gradient(1.5px 1.5px at 30% 80%,var(--glow),transparent),
      radial-gradient(2px 2px at 88% 60%,var(--glow),transparent),
      radial-gradient(1.5px 1.5px at 10% 55%,var(--glow),transparent);
    opacity:.7}
  main{position:relative;width:min(92vw,420px);text-align:center;padding:24px}

  .logo{font-family:'Amiri',serif;font-weight:700;font-size:clamp(88px,26vw,130px);
    line-height:1;color:var(--paper);
    text-shadow:0 0 24px rgba(246,215,122,.8),0 0 60px rgba(246,215,122,.4);
    animation:rise 1.2s ease-out both}
  .subtitle{font-family:'Amiri',serif;font-size:28px;margin-top:4px;color:var(--glow);
    animation:rise 1.2s .15s ease-out both}

  /* المصحف المفتوح */
  .book{margin:28px auto 34px;width:210px;height:120px;position:relative;
    animation:rise 1.2s .3s ease-out both}
  .book::before{content:"";position:absolute;left:50%;top:-30px;width:160px;height:160px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(246,215,122,.85),transparent 65%)}
  .page{position:absolute;top:20px;width:100px;height:90px;
    background:linear-gradient(180deg,var(--paper),#ecd9a8);
    border:4px solid var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .page.r{right:5px;border-radius:6px 22px 8px 6px;transform:perspective(300px) rotateY(18deg)}
  .page.l{left:5px;border-radius:22px 6px 6px 8px;transform:perspective(300px) rotateY(-18deg)}
  .page::after{content:"";position:absolute;inset:14px;border-radius:50%;
    border:3px double var(--teal);opacity:.8}

  .actions{display:flex;flex-direction:column;gap:14px;animation:rise 1.2s .5s ease-out both}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 24px;border-radius:16px;
    font:700 20px 'Cairo',sans-serif;text-decoration:none;cursor:pointer;
    border:2px solid var(--gold);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
  .btn svg{width:24px;height:24px;fill:currentColor}
  .listen{background:var(--gold);color:var(--deep);box-shadow:0 6px 22px rgba(217,170,69,.45)}
  .read{background:rgba(11,59,60,.55);color:var(--paper);backdrop-filter:blur(4px)}

  .credit{text-align:center;direction:ltr;font:500 14px 'Cairo',sans-serif;color:var(--glow);opacity:.85;letter-spacing:.3px}
  main .credit{margin-top:26px;animation:rise 1.2s .7s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <h1 class="logo">نُور</h1>
  <p class="subtitle">القرآن الكريم</p>

  <div class="book" aria-hidden="true"><div class="page l"></div><div class="page r"></div></div>

  <div class="actions">
    <!-- غيّر الروابط إلى صفحاتك -->
    <a class="btn listen" href="listen.html">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>
      استماع
    </a>
    <a class="btn read" href="read.html">
      <svg viewBox="0 0 24 24"><path d="M12 6C10.5 4.9 8.4 4.5 4 4.5v13c4.4 0 6.5.4 8 1.5 1.5-1.1 3.6-1.5 8-1.5v-13c-4.4 0-6.5.4-8 1.5z"/></svg>
      قراءة
    </a>
  </div>

  <p class="credit">By Mahdi Albna</p>
</main>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
