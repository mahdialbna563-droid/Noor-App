<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3b3c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>نور - الاستماع</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--deep:#0b3b3c;--teal:#13686a;--glow:#f6d77a;--gold:#d9aa45;--paper:#fff8e6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',Tahoma,sans-serif;color:var(--paper);min-height:100vh;
    background:radial-gradient(circle at 50% 0%,#1f8a88 0%,var(--teal) 35%,var(--deep) 100%) fixed;
    padding-bottom:150px}
  header{position:sticky;top:0;z-index:5;background:rgba(11,59,60,.92);backdrop-filter:blur(6px);
    padding:14px 16px;border-bottom:1px solid rgba(217,170,69,.4)}
  .top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 10px}
  .top h1{font-family:'Amiri',serif;font-size:28px;color:var(--glow)}
  .back{color:var(--paper);text-decoration:none;border:1px solid var(--gold);border-radius:10px;padding:6px 14px;font-size:15px}
  .search{display:block;width:100%;max-width:640px;margin:0 auto;padding:12px 16px;border-radius:12px;
    border:1px solid var(--gold);background:rgba(255,248,230,.1);color:var(--paper);font:500 16px 'Cairo',sans-serif}
  .search::placeholder{color:rgba(255,248,230,.6)}
  .search:focus-visible,.back:focus-visible,button:focus-visible,li:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

  ul{list-style:none;max-width:640px;margin:14px auto;padding:0 12px}
  li{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;
    border-radius:14px;background:rgba(11,59,60,.5);border:1px solid transparent;transition:background .15s}
  li:hover{background:rgba(11,59,60,.8)}
  li.active{border-color:var(--gold);background:rgba(217,170,69,.18)}
  .num{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;
    border:2px solid var(--gold);font-weight:700;color:var(--glow)}
  .name{font-family:'Amiri',serif;font-size:24px;font-weight:700;flex:1}
  .state{font-size:13px;color:var(--glow)}
  .empty{text-align:center;padding:30px;color:var(--glow)}

  .credit{text-align:center;direction:ltr;font:500 14px 'Cairo',sans-serif;color:var(--glow);opacity:.85;letter-spacing:.3px}
  footer.credit{margin:18px 0 10px}
  .player{position:fixed;bottom:0;inset-inline:0;background:rgba(8,44,45,.97);backdrop-filter:blur(8px);
    border-top:2px solid var(--gold);padding:12px 16px 16px}
  .inner{max-width:640px;margin:0 auto}
  .now{font-family:'Amiri',serif;font-size:22px;text-align:center;color:var(--glow);margin-bottom:6px}
  .bar{display:flex;align-items:center;gap:10px;direction:ltr;font-size:13px}
  input[type=range]{flex:1;accent-color:var(--gold)}
  .ctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:8px;direction:ltr}
  button{background:none;border:none;color:var(--paper);cursor:pointer;display:grid;place-items:center}
  button svg{width:30px;height:30px;fill:currentColor}
  #play{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--deep)}
  #play svg{width:30px;height:30px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>الاستماع</h1>
    <a class="back" href="noor.html">الرئيسية</a>
  </div>
  <input class="search" id="q" type="search" placeholder="ابحث عن سورة (بالاسم أو الرقم)">
</header>

<ul id="list"></ul>

<footer class="credit">By Mahdi Albna</footer>

<div class="player">
  <div class="inner">
    <div class="now" id="now">اختر سورة للاستماع</div>
    <div class="bar">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="التقدم">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <!-- السورة التالية (يسار) -->
      <button id="next" aria-label="السورة التالية"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="play" aria-label="تشغيل / إيقاف"><svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="prev" aria-label="السورة السابقة"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
  // ===== إعدادات ملفات الصوت =====
  // ضع ملفاتك في مجلد audio (رقم السورة من ثلاث خانات ثم اسمها)
  // يجرّب الصفحة أشكال أسماء الملفات المتوقعة تلقائيًا، مثل:
  //   001 الفاتحة.mp3  |  001الفاتحة.mp3  |  001 - الفاتحة.mp3  |  001.mp3
  const seps = [" ", "", " - ", "-", "_"];
  const norm = t => t.replace(/[أإآ]/g, "ا");
  let good = null, tries = [], ti = 0;

  // أسماء ملفات الصوت كما هي عندك بالضبط (001 الفاتحة.mp3 ... 114 الناس.mp3)
  const fileNames = "الفاتحة،البقرة،آل عمران،النساء،المائدة،الأنعام،الأعراف،الأنفال،التوبة،يونس،هود،يوسف،الرعد،إبراهيم،الحجر،النحل،الإسراء،الكهف،مريم،طه،الأنبياء،الحج،المؤمنون،النور،الفرقان،الشعراء،النمل،القصص،العنكبوت،الروم،لقمان،السجدة،الأحزاب،سبأ،فاطر،يس،الصافات،ص،الزمر،غافر،فصلت،الشورى،الزخرف،الدخان،الجاثية،الأحقاف،محمد،الفتح،الحجرات،ق،الذاريات،الطور،النجم،القمر،الرحمن،الواقعة،الحديد،المجادلة،الحشر،الممتحنة،الصف،الجمعة،المنافقون،التغابن،الطلاق،التحريم،الملك،القلم،الحاقة،المعارج،نوح،الجن،المزمل،المدثر،القيامة،الإنسان،المرسلات،النبأ،النازعات،عبس،التكوير،الإنفطار،المطففين،الإنشقاق،البروج،الطارق،الأعلى،الغاشية،الفجر،البلد،الشمس،الليل،الضحى،الشرح،التين،العلق،القدر،البينة،الزلزلة،العاديات،القارعة،التكاثر،العصر،الهمزة،الفيل،القريش،الماعون،الكوثر،الكافرون،النصر،المسد،الإخلاص،الفلق،الناس".split("،");

  function candidates(n) {
    const num = String(n).padStart(3, "0");
    const names = [...new Set([fileNames[n - 1], surahs[n - 1], norm(fileNames[n - 1]), norm(surahs[n - 1])])];
    const out = [];
    seps.forEach((sep, si) => names.forEach((nm, k) => {
      const f = num + sep + nm + ".mp3";
      out.push({f, shape: si + "-" + k});
      if (si === 0 && k === 0 && f.normalize("NFD") !== f) out.push({f: f.normalize("NFD"), shape: "nfd"});
    }));
    out.push({f: num + ".mp3", shape: "bare"});
    if (good) out.sort((x, y) => (y.shape === good) - (x.shape === good));  // الشكل الناجح أولًا
    return out;
  }

  function tryNext(n) {
    if (current !== n) return;
    if (ti >= tries.length) {
      $("now").textContent = "لم أجد ملف سورة " + surahs[n - 1] + " في مجلد audio";
      updateState(); return;
    }
    audio.src = "audio/" + encodeURI(tries[ti].f);
    audio.play().catch(() => {});
  }

  const surahs = "الفاتحة،البقرة،آل عمران،النساء،المائدة،الأنعام،الأعراف،الأنفال،التوبة،يونس،هود،يوسف،الرعد،إبراهيم،الحجر،النحل،الإسراء،الكهف،مريم،طه،الأنبياء،الحج،المؤمنون،النور،الفرقان،الشعراء،النمل،القصص،العنكبوت،الروم،لقمان،السجدة،الأحزاب،سبأ،فاطر،يس،الصافات،ص،الزمر،غافر،فصلت،الشورى،الزخرف،الدخان،الجاثية،الأحقاف،محمد،الفتح،الحجرات،ق،الذاريات،الطور،النجم،القمر،الرحمن،الواقعة،الحديد،المجادلة،الحشر،الممتحنة،الصف،الجمعة،المنافقون،التغابن،الطلاق،التحريم،الملك،القلم،الحاقة،المعارج،نوح،الجن،المزمل،المدثر،القيامة،الإنسان،المرسلات،النبأ،النازعات،عبس،التكوير،الانفطار،المطففين،الانشقاق،البروج،الطارق،الأعلى،الغاشية،الفجر،البلد،الشمس،الليل،الضحى،الشرح،التين،العلق،القدر،البينة،الزلزلة،العاديات،القارعة،التكاثر،العصر،الهمزة،الفيل،قريش،الماعون،الكوثر،الكافرون،النصر،المسد،الإخلاص،الفلق،الناس".split("،");

  const $ = id => document.getElementById(id);
  const audio = $("audio"), list = $("list");
  let current = 0;

  const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
  const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";

  function render(filter = "") {
    const f = filter.trim();
    const items = surahs.map((n, i) => ({n, num: i + 1}))
      .filter(s => !f || s.n.includes(f) || String(s.num) === f);
    list.innerHTML = items.length ? "" : '<li class="empty" style="justify-content:center;cursor:default">لا توجد نتائج</li>';
    items.forEach(s => {
      const li = document.createElement("li");
      li.tabIndex = 0;
      li.dataset.num = s.num;
      if (s.num === current) li.classList.add("active");
      li.innerHTML = '<span class="num">' + s.num + '</span><span class="name">سورة ' + s.n + '</span><span class="state"></span>';
      li.onclick = () => playSurah(s.num);
      li.onkeydown = e => { if (e.key === "Enter") playSurah(s.num); };
      list.appendChild(li);
    });
    updateState();
  }

  function updateState() {
    document.querySelectorAll("li[data-num]").forEach(li => {
      const on = +li.dataset.num === current;
      li.classList.toggle("active", on);
      li.querySelector(".state").textContent = on ? (audio.paused ? "متوقفة" : "جارٍ التشغيل") : "";
    });
    $("ico").innerHTML = '<path d="' + (audio.paused ? PLAY : PAUSE) + '"/>';
  }

  function playSurah(n) {
    if (n < 1 || n > 114) return;
    current = n;
    $("now").textContent = "سورة " + surahs[n - 1];
    tries = candidates(n); ti = 0;
    tryNext(n);
    updateState();
  }

  $("play").onclick = () => {
    if (!current) return playSurah(1);
    audio.paused ? audio.play() : audio.pause();
  };
  $("next").onclick = () => playSurah(current ? current + 1 : 1);
  $("prev").onclick = () => playSurah(current - 1);
  $("q").oninput = e => render(e.target.value);

  audio.onplay = audio.onpause = updateState;
  audio.onended = () => playSurah(current + 1);
  audio.ontimeupdate = () => {
    $("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) $("seek").value = audio.currentTime / audio.duration * 100;
  };
  audio.onloadedmetadata = () => { $("dur").textContent = fmt(audio.duration); if (tries[ti]) good = tries[ti].shape; };
  audio.onerror = () => { ti++; tryNext(current); };
  $("seek").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };

  render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
